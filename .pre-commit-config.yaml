default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

# Hook environments must parse the Python 3.15 syntax the code base uses.
default_language_version:
  python: python3.15

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: builtin
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args:
          - --pytest-test-first
        exclude: (^|/)_[^/]*\.py$ # files starting with an underscore are not test modules

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        # Report only: --write-changes would "correct" domain words such as Steam's field names.
        args:
          - --force-exclude

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.8
    hooks:
      - id: uv-lock
      - id: uv-sync
        always_run: true
        args:
          - --locked

  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.6.0
    hooks:
      - id: sync-with-uv

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.6
    hooks:
      - id: pyproject-fmt

  # The other TOML files; pyproject.toml belongs to pyproject-fmt.
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        exclude: ^pyproject\.toml$
      - id: taplo-lint
        exclude: ^pyproject\.toml$
        # No schema catalogs: none of these files has a schema, and fetching it needs the network.
        args: []

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        language: python
        additional_dependencies:
          - mdformat-footnote==0.1.3  # sync-with-uv
          - mdformat-frontmatter==2.2.0  # sync-with-uv
          - mdformat-gfm==1.0.0  # sync-with-uv
          - mdformat-ruff==0.1.3  # sync-with-uv
          - mdformat-toc==0.5.0  # sync-with-uv
          # The engines behind the formatting, pinned so they too change only with uv.lock.
          - markdown-it-py==4.3.0  # sync-with-uv
          - mdit-py-plugins==0.7.0  # sync-with-uv
          - mdurl==0.1.2  # sync-with-uv
          - ruamel-yaml==0.19.1  # sync-with-uv
          - ruff==0.17.5  # sync-with-uv
          - wcwidth==0.9.4  # sync-with-uv

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        language: golang
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  # In its own environment, never the project's: pydoclint needs docstring-parser-fork, which
  # provides the same `docstring_parser` module as the docstring-parser that cyclopts needs.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        args:
          - --config=.flake8
        language: python
        additional_dependencies:
          - flake8-cognitive-complexity==0.1.0  # sync-with-uv
          - flake8-rst-docstrings==0.4.0  # sync-with-uv
          - pydoclint[flake8]==0.12.0  # sync-with-uv
          # The checks' engines, pinned so they too change only with uv.lock.
          - cognitive-complexity==1.3.0  # sync-with-uv
          - docstring-parser-fork==0.0.16  # sync-with-uv
          - docutils==0.23  # sync-with-uv
          - mccabe==0.7.0  # sync-with-uv
          - pycodestyle==2.15.0  # sync-with-uv
          - pyflakes==4.1.0  # sync-with-uv
          - pygments==2.21.0  # sync-with-uv
          - restructuredtext-lint==2.0.2  # sync-with-uv

  # These run in the project's own environment, so their versions come straight from uv.lock
  # and they see the same installed packages as the code they check.
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --exact pylint src tests
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi

      - id: ty
        name: ty check
        entry: uv run --exact ty check
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi

      - id: mypy
        name: mypy
        entry: uv run --exact mypy .
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi

      - id: deptry
        name: deptry
        entry: uv run --exact deptry .
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true

      - id: just-fmt
        name: justfile is formatted
        entry: just --fmt --check
        language: python
        additional_dependencies:
          - rust-just==1.59.0  # sync-with-uv
        pass_filenames: false
        files: ^justfile$
