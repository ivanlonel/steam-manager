name: "📚 Documentation"

# Built on every pull request, so a warning fails it before merge; deployed from main only.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"

jobs:
  build:
    name: "🏗 Build docs"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # Supersede in-progress builds; the deploy job queues on its own `pages` group instead.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # This workflow deploys to Pages: never restore a cache another run wrote.
          enable-cache: false

      - name: Build the site
        run: >-
          uv run --locked --no-dev --group doc sphinx-build
          -M html docs docs/_build -j auto -W --keep-going

      - name: Upload the Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html/

  deploy:
    name: "🚀 Deploy to GitHub Pages"
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deployments must not cancel each other mid-flight: queue them.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
