name: "⬆️ Post-Renovate Hooks"

on:
  pull_request:
    types:
      - opened
      - synchronize

env:
  PYTHON_VERSION: "3.15"

jobs:
  post-renovate-hooks:
    name: "⬆️ Apply the dependency hooks"
    # Only on pull requests the Renovate app opened. The author comes from the event payload,
    # not github.actor, which is whoever triggered this run and can be spoofed (zizmor
    # bot-conditions).
    if: github.event.pull_request.user.login == 'renovate[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'pep621') ||
      contains(github.event.pull_request.labels.*.name, 'pre-commit'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # uv and the hooks run third-party code, some of it released minutes ago, so this job
    # holds no write credential at all and only hands its diff to commit-hooks. A token added
    # in a later step of the same job would not be safe either: a hook can plant .git/hooks
    # or leave a process behind to read it.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit this run is for; commit-hooks refuses to push if the branch moved since.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Persist uv's download cache across runs (rolling restore-keys).
          enable-cache: true

      # Stands in for Renovate's lock file maintenance (disabled in renovate.json): its branch
      # changes only uv.lock, so Renovate would rebuild it on every run once this job had
      # committed to it. The weekly group branch also bumps pyproject.toml, so the refresh can
      # sit in this job's commit, where sync-with-uv re-pins every hook to it. Like Renovate's
      # minimumReleaseAge, it skips releases younger than a day; local upgrades don't. uv.lock
      # records the cutoff, which would fail every later `--locked` run, so a plain `uv lock`
      # removes it again, keeping the versions just chosen.
      - name: Refresh uv.lock (weekly group pull request only)
        if: github.head_ref == 'renovate/pep621-pre-commit'
        run: |
          uv lock --upgrade --exclude-newer "1 day"
          uv lock

      # sync-with-uv copies the versions in uv.lock into .pre-commit-config.yaml, then
      # pyproject-fmt tidies what Renovate wrote. Each runs twice: the first pass may fail
      # merely because it changed files; the second must pass, or the result is not stable.
      - name: prek – sync-with-uv (first pass)
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv
        continue-on-error: true

      - name: prek – sync-with-uv (verify)
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv

      - name: prek – pyproject-fmt (first pass)
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt
        continue-on-error: true

      - name: prek – pyproject-fmt (verify)
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt

      - name: Save the hook results
        id: diff
        run: |
          git diff --binary > "$RUNNER_TEMP/hooks.patch"
          git diff --stat
          if [ -s "$RUNNER_TEMP/hooks.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the hook results
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hooks-patch
          path: ${{ runner.temp }}/hooks.patch
          if-no-files-found: error
          retention-days: 1

  commit-hooks:
    name: "⬆️ Commit the dependency hooks"
    # Pushes the diff of the job above with RENOVATE_TOKEN (a push with this job's own token
    # would not start CI). Nothing from the branch runs here: checkout, git apply, commit, push.
    needs: post-renovate-hooks
    if: needs.post-renovate-hooks.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      # artipacked is ignored: the credentials stay in .git/config for the push in the last
      # step, and no code from the branch runs in this job to read them.
      - name: Check out the pull request's branch # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Stop if the branch moved since the hooks ran
        env:
          HOOKED: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HOOKED" ]; then
            echo "::error::The branch moved past $HOOKED; the run for its new head applies the hooks."
            exit 1
          fi

      - name: Download the hook results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hooks-patch
          path: ${{ runner.temp }}/hooks

      # Only the files the hooks are meant to touch: once an --include is given, git apply
      # skips every other path.
      - name: Apply the hook results
        run: |
          git apply --include=.pre-commit-config.yaml --include=pyproject.toml --include=uv.lock \
            "$RUNNER_TEMP/hooks/hooks.patch"
          git diff --stat

      - name: Commit the changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(deps): apply post-Renovate hooks"
          # Renovate ignores commits by this author (gitIgnoredAuthors in renovate.json), so it
          # keeps rebasing the branch. The default author, github.actor, would be the
          # RENOVATE_TOKEN owner, which makes Renovate treat the branch as edited by hand.
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
