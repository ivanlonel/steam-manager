name: "✅ Linting"

# A branch is checked through its pull request to main; pushes are checked on main only,
# so a pull request's commits don't run everything twice.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Supersede in-progress runs for the same branch/PR instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15"

jobs:
  prek:
    name: "🧹 Git hooks"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the tip, for the secret scan below: at depth 1 a secret added
          # and then removed inside a pull request passes, and a rebase merge lands it on main.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Persist uv's download cache across runs (rolling restore-keys).
          enable-cache: true

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose

      # The commit-time gitleaks hook scans staged changes, and nothing is staged here.
      - name: Scan the commits for secrets
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose --hook-stage manual gitleaks-history

      # Contributors without PowerShell rely on the recipes working in sh, which nothing
      # else exercises: the maintainer's machine runs them in pwsh. `just` comes from the
      # hook group in an isolated environment, because that group must never be installed
      # next to the project (see its comment in pyproject.toml).
      - name: Check that the justfile's recipes run in sh
        run: uv run --locked --isolated --only-group hook just lint
