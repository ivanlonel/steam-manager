name: "🚀 Release"

# A version tag builds the wheel and the source distribution and attaches them to a GitHub
# Release. Nothing is uploaded to PyPI (the "Private :: Do Not Upload" classifier).
on:
  push:
    tags:
      - "v*.*.*"

# Re-pushing a tag must not cancel a release mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.15"

jobs:
  release:
    name: "🚀 Release on tag"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # A release job never restores a cache another run wrote.
          enable-cache: false

      - name: Check that the tag names the project's version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - name: Build the wheel and the source distribution
        run: uv build

      # The runner's own gh instead of a third-party action. The notes are generated from the
      # merged pull requests, sorted by .github/release.yml.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
