[build-system]
build-backend = "uv_build"
requires = [
  "uv-build>=0.13.8,<0.14",
]

[project]
name = "steam-manager"
version = "0.1.0"
description = "Gather a Steam account's store and account data into a per-account SQLite database"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ivan Donisete Lonel" },
]
# Moving the floor? Move .python-version and the workflows' PYTHON_VERSION with it.
requires-python = ">=3.15"
classifiers = [
  # Releases are GitHub Releases only; this stops an accidental upload to PyPI.
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
# A runtime dependency is declared by the change that first imports it (deptry enforces this).
dependencies = []
urls.Repository = "https://github.com/ivanlonel/steam-manager"

[dependency-groups]
dev = [
  "deptry~=0.25.1",
  "flake8~=7.5.0",
  "flake8-cognitive-complexity~=0.1.0",
  "flake8-rst-docstrings~=0.4.0",
  "prek~=0.5.10",
  "pydoclint[flake8]~=0.12.0",
  "pylint~=4.1.3",
  "ruff~=0.17.5",
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "hypothesis~=6.170.15",
  "pytest~=9.2.0",
  "pytest-cov~=7.1.0",
]
type = [
  "mypy[faster-cache]~=2.4.1",
  "ty~=0.0.104",
]
# Packages that are not installed in the local environment but run as git hooks. Listing them
# keeps their versions in uv.lock, from where sync-with-uv copies them into
# .pre-commit-config.yaml, so a hook changes only in the pull request that changes the lock.
hook = [
  "editorconfig-checker~=3.11.1",
  "mdformat~=1.0.0",
  "mdformat-footnote~=0.1.3",
  "mdformat-frontmatter~=2.2.0",
  "mdformat-gfm~=1.0.0",
  "mdformat-ruff~=0.1.3",
  "mdformat-toc~=0.5.0",
  "pre-commit-hooks~=6.0.0",
  "pyproject-fmt~=2.30.6",
  "rust-just~=1.59.0",
  "sync-with-uv~=0.6.0",
  "taplo~=0.9.3",
  "typos~=1.52.2",
  "uv~=0.13.8",
  "zizmor~=1.32.0",
]

[tool.uv]
required-version = ">=0.13"
