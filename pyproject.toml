[build-system]
build-backend = "uv_build"
requires = [
  "uv-build>=0.13.8,<0.14",
]

[project]
name = "steam-manager"
version = "0.1.0"
description = "Gather a Steam account's store and account data into a per-account SQLite database"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ivan Donisete Lonel" },
]
# Moving the floor? Move .python-version and the workflows' PYTHON_VERSION with it.
requires-python = ">=3.15"
classifiers = [
  # Releases are GitHub Releases only; this stops an accidental upload to PyPI.
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
# A runtime dependency is declared by the change that first imports it (deptry enforces this).
dependencies = []
urls.Repository = "https://github.com/ivanlonel/steam-manager"

[dependency-groups]
dev = [
  "deptry~=0.25.1",
  "prek~=0.5.10",
  "pylint~=4.1.3",
  "ruff~=0.17.5",
  # In dev, not only beside it: the `uv run --exact` hooks would otherwise uninstall it, under a
  # running `just docs-live` too (on Windows a running .exe can't be removed, so they fail).
  { include-group = "doc" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "hypothesis~=6.170.15",
  "pytest~=9.2.0",
  "pytest-cov~=7.1.0",
]
type = [
  "mypy[faster-cache]~=2.4.1",
  "ty~=0.0.104",
]
doc = [
  "myst-parser[linkify]~=5.2.0",
  "sphinx~=9.2.0",
  "sphinx-autobuild~=2025.8.25",
  "sphinx-autodoc-typehints~=3.17.5",
  "sphinx-copybutton~=0.5.2",
  "sphinx-rtd-theme~=3.1.0",
]
# Packages that are not installed in the local environment but run as git hooks. Listing them
# keeps their versions in uv.lock, from where sync-with-uv copies them into
# .pre-commit-config.yaml, so a hook changes only in the pull request that changes the lock.
# Never install this group next to the project: pydoclint needs docstring-parser-fork and
# cyclopts needs docstring-parser, and both provide the same `docstring_parser` module.
hook = [
  "editorconfig-checker~=3.11.1",
  "flake8~=7.5.0",
  "flake8-cognitive-complexity~=0.1.0",
  "flake8-rst-docstrings~=0.4.0",
  "mdformat~=1.0.0",
  "mdformat-footnote~=0.1.3",
  "mdformat-frontmatter~=2.2.0",
  "mdformat-gfm~=1.0.0",
  "mdformat-ruff~=0.1.3",
  "mdformat-toc~=0.5.0",
  "pre-commit-hooks~=6.0.0",
  "pydoclint[flake8]~=0.12.0",
  "pyproject-fmt~=2.30.6",
  "rust-just~=1.59.0",
  "sync-with-uv~=0.6.0",
  "taplo~=0.9.3",
  "typos~=1.52.2",
  "uv~=0.13.8",
  "zizmor~=1.32.0",
]

[tool.uv]
required-version = ">=0.13"
# Every lock, the weekly `uv lock --upgrade` included, skips releases younger than a day, as
# Renovate's minimumReleaseAge does. Set here, not per command: uv.lock records it, and a lock
# made without it fails `--locked`.
exclude-newer = "1 day"

[tool.ruff]
required-version = ">=0.17"
line-length = 99
format.docstring-code-line-length = 99
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Trailing comma missing (conflicts with the formatter)
  "CPY001", # Missing copyright notice at top of file
  "D203",   # Use a blank line to separate the docstring from the class definition
  "D212",   # Multi-line docstring summary should start at the first line
]
lint.per-file-ignores."docs/conf.py" = [
  "INP001", # Sphinx loads conf.py by path, not as part of a package
]
lint.per-file-ignores."tests/**/*.py" = [
  "PLR2004", # Magic values are OK in tests
  "S101",    # assert is a first class citizen in pytest tests
]
lint.mccabe.max-complexity = 12  # default 10  # C901
lint.pylint.max-args = 10  # default 5  # PLR0913

[tool.pylint]
messages_control.disable = [
  "broad-exception-caught",     # W0718 — governed by ruff BLE001.
  "import-error",               # E0401 — governed by mypy and ty.
  "import-outside-toplevel",    # C0415 — governed by ruff PLC0415.
  "invalid-name",               # C0103 — governed by ruff N*.
  "line-too-long",              # C0301 — governed by ruff E501.
  "missing-function-docstring", # C0116 — governed by ruff D103.
  "no-member",                  # E1101 — governed by mypy and ty.
  "no-name-in-module",          # E0611 — governed by mypy and ty.
  "protected-access",           # W0212 — governed by ruff SLF001 (enforced in non-test code).
  "redefined-builtin",          # W0622 — governed by ruff A001/A002/A004.
  "too-few-public-methods",     # R0903 — data models and mapped classes rarely have any.
  "too-many-arguments",         # R0913 — governed by ruff (lint.pylint.max-args).
  "unused-argument",            # W0613 — governed by ruff ARG001/ARG002.
  "wrong-import-order",         # C0411 — governed by ruff I001.
  "wrong-import-position",      # C0413 — governed by ruff E402.
]
ignore-paths = [
  ".*/__pycache__/.*",
  "^[.].*/.*",         # Can't use \. because pylint reads backslashes as folder separators
  "^build/.*",
  "^dist/.*",
  "^docs/_build/.*",
]
# Not 0 (one per CPU): parallel runs pickle the linter with dill, and dill 0.4.1 reads
# `co_lnotab`, which Python 3.15 removed.
jobs = 1

[tool.typos]
default.extend-words.optin = "optin"  # Steam's field names: include_optin_registration_tags
default.extend-words.CPY = "CPY"  # ruff's flake8-copyright rules: CPY001

[tool.mypy]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
extra_checks = true
strict_equality = true
strict_equality_for_none = true
show_error_context = true
show_column_numbers = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.pyright]
# Not part of the gate: lets Pylance/Pyright in an editor use the project's Python 3.15 venv.
venv = ".venv"
venvPath = "."

[tool.ty]
analysis.respect-type-ignore-comments = false

[tool.pytest]
addopts = [
  "-ra",
  "--cov=steam_manager",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  # Network tests never run unless asked for: `pytest -m live`.
  "-m",
  "not live",
]
markers = [
  "live: talks to Steam or HowLongToBeat over the network; never runs in CI (select with '-m live')",
]
minversion = "9.2"
python_files = [
  "test_*.py",
]
strict = true
testpaths = [
  "tests",
]

[tool.coverage]
run.branch = true
run.relative_files = true
report.fail_under = 90
report.exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.show_missing = true

[tool.sync-with-uv]
repo-to-package."https://github.com/astral-sh/uv-pre-commit" = "uv"
repo-to-package."https://github.com/ComPWA/taplo-pre-commit" = "taplo"
repo-to-package."https://github.com/editorconfig-checker/editorconfig-checker.python" = "editorconfig-checker"
repo-to-package."https://github.com/zizmorcore/zizmor-pre-commit" = "zizmor"
# Not the `pre-commit-hooks` package its name suggests: Renovate itself, which Renovate updates.
repo-to-package."https://github.com/renovatebot/pre-commit-hooks" = ""
